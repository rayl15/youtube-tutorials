[project]
name = "aws-mcp-server"
version = "0.1.0"
description = "Read-only AWS MCP server — let Claude audit your AWS account safely (EC2, idle resources, Cost Explorer, security groups, S3)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "boto3>=1.34.0",
]

# Single-file script project, not an installable package — tell uv not to
# build/install it. `uv run server.py` just makes a venv with the deps + runs it.
[tool.uv]
package = false
